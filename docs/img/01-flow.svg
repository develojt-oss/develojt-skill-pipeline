        <text class="ts" x="1003" y="207">→ return</text>

        <rect class="node" x="875" y="236" width="170" height="96" rx="8"/>
        <g class="agt"><rect x="879" y="243" width="98" height="15" rx="7.5"/><text x="928" y="254">isolated checker</text></g>
        <text class="tt tc" x="960" y="272">pdca</text>
