        <text class="tt tc" x="330" y="84">deriver</text>
        <text class="tr tc" x="330" y="105">writes EARS requirements</text>
        <text class="tm tc" x="330" y="125">spec/SPEC.md</text>
        <g class="seal" transform="rotate(-6 389 48)"><rect x="355.6" y="39" width="66.8" height="18" rx="3"/><text x="389" y="52">Approval</text></g>
        <g class="gate"><rect x="287.5" y="135" width="85" height="18" rx="9"/><text x="330" y="148">✓ verify ×3</text></g>

        <rect class="node-opt" x="455" y="48" width="170" height="96" rx="8"/>
        <g class="agt"><rect x="463" y="55" width="66" height="15" rx="7.5"/><text x="496" y="66">2 agents</text></g>
        <text class="tt tc" x="540" y="84">mapper</text>
