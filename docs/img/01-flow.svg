        <g class="seal" transform="rotate(-6 1019 48)"><rect x="985.6" y="39" width="66.8" height="18" rx="3"/><text x="1019" y="52">Approval</text></g>
        <g class="gate"><rect x="895.5" y="135" width="129" height="18" rx="9"/><text x="960" y="148">✓ verify ×4 + boot</text></g>

        <path class="arr-flow" d="M207,96 H242"/>
        <path class="arr-flow" d="M417,96 H452"/>
