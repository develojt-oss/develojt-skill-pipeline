        <text class="tt tc" x="750" y="84">spliter</text>
        <text class="tr tc" x="750" y="105">progress list by bundle</text>
        <text class="tm tc" x="750" y="125">spec/joblist.md</text>
        <g class="gate"><rect x="707.5" y="135" width="85" height="18" rx="9"/><text x="750" y="148">✓ verify ×3</text></g>

