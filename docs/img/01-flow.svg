        <text class="tm tc" x="960" y="313">spec/findings.md</text>
        <g class="gate"><rect x="908.55" y="323" width="102.9" height="18" rx="9"/><text x="960" y="336">✓ ledger check</text></g>

        <path class="arr-flow" d="M873,284 H763"/>
