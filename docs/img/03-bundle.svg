        <text class="th" x="244" y="36">Assess state · read only</text>
        <text class="ts" x="244" y="53">next unchecked bundle · open defects · structure contract · design/</text>

        <rect class="node" x="200" y="78" width="440" height="46" rx="8"/>
        <g class="num"><circle cx="222" cy="101" r="11"/><text x="222" y="105">2</text></g>
        <text class="th" x="244" y="98">Report → stop → approval</text>
        <text class="ts" x="244" y="115">progress · this scope · how the design is reflected</text>
        <g class="seal" transform="rotate(-6 600 101)"><rect x="566.6" y="92" width="66.8" height="18" rx="3"/><text x="600" y="105">Approval</text></g>

        <rect class="node" x="200" y="140" width="440" height="46" rx="8"/>
        <g class="num"><circle cx="222" cy="163" r="11"/><text x="222" y="167">3</text></g>
        <text class="th" x="244" y="160">Re-read the rules</text>
        <text class="ts" x="244" y="177">re-read design/README.md · rules · ARCHITECTURE.md</text>

        <rect class="node" x="200" y="202" width="440" height="46" rx="8"/>
        <g class="num"><circle cx="222" cy="225" r="11"/><text x="222" y="229">4</text></g>
        <text class="th" x="244" y="222">Implement · the main session directly</text>
        <text class="ts" x="244" y="239">record in the joblist each time a module or flow is done</text>

        <rect class="node" x="200" y="264" width="440" height="46" rx="8"/>
        <g class="num"><circle cx="222" cy="287" r="11"/><text x="222" y="291">5</text></g>
        <text class="th" x="244" y="284">Self-check</text>
        <text class="ts" x="244" y="301">@spec · empty functions · requirements reflected · comment language</text>
        <g class="gate"><rect x="443" y="271" width="85" height="18" rx="9"/><text x="485.5" y="284">✓ verify ×4</text></g>
        <g class="gate"><rect x="534" y="271" width="98" height="18" rx="9"/><text x="583" y="284">✓ verify_boot</text></g>

        <rect class="node" x="200" y="326" width="440" height="46" rx="8"/>
        <g class="num"><circle cx="222" cy="349" r="11"/><text x="222" y="353">6</text></g>
        <text class="th" x="244" y="346">pdca auto-runs · until quiescence</text>
        <text class="ts" x="244" y="363">never asks while repeating · the checker doesn't know the intent</text>
        <g class="agt"><rect x="528" y="333" width="104" height="16" rx="8"/><text x="580" y="345">isolated checker</text></g>

        <rect class="node" x="200" y="388" width="440" height="46" rx="8"/>
        <g class="num"><circle cx="222" cy="411" r="11"/><text x="222" y="415">7</text></g>
        <text class="th" x="244" y="408">Run check once more</text>
        <text class="ts" x="244" y="425">confirms it still builds and runs after pdca's fixes</text>
        <g class="gate"><rect x="534" y="402" width="98" height="18" rx="9"/><text x="583" y="415">✓ verify_boot</text></g>

        <rect class="node" x="200" y="450" width="440" height="46" rx="8"/>
        <g class="num"><circle cx="222" cy="473" r="11"/><text x="222" y="477">8</text></g>
        <text class="th" x="244" y="470">List for screen comparison → human confirms</text>
        <text class="ts" x="244" y="487">only bundles with screens · compared once implementation ends</text>
        <g class="seal" transform="rotate(-6 600 473)"><rect x="566.6" y="464" width="66.8" height="18" rx="3"/><text x="600" y="477">Approval</text></g>

        <rect class="node" x="200" y="512" width="440" height="46" rx="8"/>
        <g class="num"><circle cx="222" cy="535" r="11"/><text x="222" y="539">9</text></g>
        <text class="th" x="244" y="532">Proceed to the next bundle?</text>
        <text class="ts" x="244" y="549">the human's answer counts as next-scope approval</text>
        <g class="seal" transform="rotate(-6 600 535)"><rect x="566.6" y="526" width="66.8" height="18" rx="3"/><text x="600" y="539">Approval</text></g>

