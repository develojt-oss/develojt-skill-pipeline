<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 1112 352" width="1112" height="352" role="img" aria-label="Left is a horizontal cut that makes the production, coordination, and presentation layers into bundles 1, 2, and 3, so finishing bundles 1 and 2 shows no observable change. Right is a thin through-slice bundle 1 passing all three layers, with increment bundles 2 and 3 adding results on top of it, so every bundle is observed. Under both lies the scaffolding, that is, the walking skeleton.">
<title>Figure 5. Cutting bundles · split by layer vs. split end to end</title>
<style>
