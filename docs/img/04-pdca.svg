<svg xmlns="http://www.w3.org/2000/svg" class="dg" viewBox="-16 -16 1112 552" width="1112" height="552" role="img" aria-label="Left, one cycle: Plan, the checker's Check, ledger recording, Act, the cycle log and archival, then the quiescence verdict. If not quiescent, the next cycle starts automatically. Right, the states of a defect row: it goes through New, Fixing, Awaiting recheck, and Resolved and is archived to the archive ledger; with counter-evidence it goes to Rejected, and when a human decision is needed, to Needs review.">
<title>Figure 4. The pdca loop and defect states</title>
<style>
