        <text class="th" x="56" y="250">Act · Fix/Reject/Needs review</text>
        <text class="ts" x="56" y="267">rejection needs file:line counter-evidence</text>
        <g class="role"><rect x="278" y="246" width="40" height="16" rx="8"/><text x="298" y="258">main</text></g>

        <rect class="node" x="40" y="296" width="290" height="44" rx="8"/>
        <text class="th" x="56" y="314">Check log · move to the archive</text>
        <text class="ts" x="56" y="331">resolved defects → findings-archive.md</text>
        <g class="role"><rect x="278" y="310" width="40" height="16" rx="8"/><text x="298" y="322">main</text></g>

